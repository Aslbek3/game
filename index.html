<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nasl</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="ilova">

  <header id="sarlavha">
    <button class="doira-tugma" id="menyuTugma">&#9776;</button>
    <div class="nasl-nom">Nasl</div>
    <div class="muhr">NASL</div>
  </header>
  <div id="menyuRoyxat" class="yashirin"></div>

  <section id="malumot"></section>

  <section id="lenta"></section>

  <section id="statlar"></section>

</div>

<nav id="harakatPanel">
  <button class="harakat-ustun" id="kasbTugma" disabled title="Hali mavjud emas">
    <span class="ikon">&#128188;</span>Kasb
  </button>
  <button class="harakat-ustun" id="mulkTugma" disabled title="Hali mavjud emas">
    <span class="ikon">&#127968;</span>Mulk
  </button>
  <button class="yosh-doira" id="yoshTugma">+ Yosh</button>
  <button class="harakat-ustun" id="munosabatTugma">
    <span class="ikon">&#128101;</span>Munosabat
  </button>
  <button class="harakat-ustun" id="harakatlarTugma">
    <span class="ikon">&#9881;</span>Harakatlar
  </button>
</nav>

<div id="sheet" class="yashirin">
  <div class="sheet-ichki">
    <div class="sheet-bosh">
      <span id="sheetNom" class="sheet-nom"></span>
      <button id="sheetYopish">&times;</button>
    </div>
    <div id="sheetTana"></div>
  </div>
</div>

<div id="voqea" class="yashirin"><div class="oyna" id="voqeaOyna"></div></div>

<script src="settings_extra.js"></script>
<script src="aloqa.js"></script>
<script src="tekshir.js"></script>
<script src="resolve_year.js"></script>
<script src="engine.js"></script>
<script src="ui_intimacy.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const ekranlar = { bosh: "Bosh", odamlar: "Odamlar", sozlamalar: "Sozlamalar", yangi: "Yangi o'yin" };
let ekranSheet = null; // null | "odamlar" | "sozlamalar" | "yangi" | "harakatlar"
let tanlangan = null;
let menyuOchiq = false;
let bankOchiq = false;
let odamlarBolim = null; // null | "oila"
let harakatBolim = null; // null | "sevgi"

function el(tag, matn, cls) {
  const e = document.createElement(tag);
  if (matn != null) e.textContent = matn;
  if (cls) e.className = cls;
  return e;
}

function statQator(yorliqMatn, qiymat, maks) {
  const q = el("div", null, "stat-qator");
  q.append(el("span", yorliqMatn, "stat-yorliq"));
  const bar = el("div", null, "stat-bar");
  const foiz = Math.max(0, Math.min(100, Math.round((qiymat / maks) * 100)));
  const ich = el("i"); ich.style.width = foiz + "%";
  const sonMatn = el("span", foiz + "%", "stat-foiz");
  bar.append(ich, sonMatn);
  q.append(bar);
  return q;
}

function renderMalumot(S, B) {
  const r = $("malumot"); r.innerHTML = "";
  const me = Nasl.person(S.playerId);
  r.append(el("div", me.name[0], "avatar"));
  r.append(el("div", null, "bayroq"));

  const info = el("div", null, "shaxs-info");
  info.append(el("div", Nasl.fullName(me), "ism"));
  info.append(el("div", (S.job && S.job.title) || "Ishsiz", "kasb"));
  r.append(info);

  const moliya = el("div", null, "moliya");
  moliya.append(el("div", "$" + S.money, "pul-son"));
  const bankTugma = el("button", "Bank hisobi", "bank-tugma");
  bankTugma.onclick = () => { bankOchiq = !bankOchiq; renderMalumot(S, B); };
  moliya.append(bankTugma);
  if (bankOchiq) moliya.append(el("div", "Qarz: $" + S.debt, "qarz-qatori"));
  r.append(moliya);
}

function renderLenta(S) {
  const r = $("lenta"); r.innerHTML = "";
  const me = Nasl.person(S.playerId);
  const yillar = [];
  for (const l of S.log) {
    let guruh = yillar[yillar.length - 1];
    if (!guruh || guruh.year !== l.year) { guruh = { year: l.year, matnlar: [] }; yillar.push(guruh); }
    guruh.matnlar.push(l.text);
  }
  if (!yillar.length) { r.append(el("div", "Voqealar yo'q.", "lenta-matn")); return; }
  yillar.forEach(g => {
    r.append(el("div", `${g.year} — Yosh: ${g.year - me.born}`, "lenta-sarlavha"));
    g.matnlar.forEach(m => r.append(el("div", m, "lenta-matn")));
  });
  r.scrollTop = r.scrollHeight;
}

function renderStatlar(S, B) {
  const r = $("statlar"); r.innerHTML = "";
  const xotin = S.xotinId != null ? Nasl.person(S.xotinId) : null;
  r.append(statQator("Mehr", (xotin && xotin.mehr) || 0, B.statMax));
  r.append(statQator("Ishonch", (xotin && xotin.ishonch) || 0, B.statMax));
  r.append(statQator("Shubha", (xotin && xotin.shubha) || 0, B.statMax));
  r.append(statQator("Obro'", S.honor, B.honorMax));
  r.append(statQator("Yosh", Nasl.age(Nasl.person(S.playerId)), B.maxAge));
}

function holatMatni(p) {
  if (p.diedYear != null) return "vafot etgan";
  if (p.spouses.length) return "nikohda";
  return "yolg'iz";
}

const YAQIN_HOLAT = ["xotin", "sevgili", "yashirin"];
const YAQIN_REL = ["qiz", "o'g'il"];

function odamQatori(f, r) {
  const q = el("div", null, "qator" + (f.alive ? "" : " vafot"));
  const rel = f.holat === "sevgili" ? "sevgili" : f.rel;
  q.append(el("span", f.name), el("span", `${rel} · ${f.age} yosh${f.alive ? "" : " · vafot"}`));
  q.onclick = () => { tanlangan = f.id; renderSheet(); };
  r.append(q);
}

function odamlarEkran(r) {
  if (odamlarBolim === "oila") {
    const orqaga = el("button", "← Odamlar");
    orqaga.onclick = () => { odamlarBolim = null; renderSheet(); };
    r.append(orqaga);
    Nasl.familyView().forEach(f => odamQatori(f, r));
    return;
  }
  const oilaTugma = el("button", "Oila →");
  oilaTugma.onclick = () => { odamlarBolim = "oila"; renderSheet(); };
  r.append(oilaTugma);
  const yaqinlar = Nasl.familyView().filter(f =>
    f.alive && (YAQIN_HOLAT.includes(f.holat) || YAQIN_REL.includes(f.rel)));
  if (!yaqinlar.length) r.append(el("div", "Hozircha yaqin odam yo'q.", "lenta-matn"));
  yaqinlar.forEach(f => odamQatori(f, r));
}

function kartochka(r, S) {
  const p = Nasl.person(tanlangan);
  const orqaga = el("button", "← Ro'yxatga");
  orqaga.onclick = () => { tanlangan = null; renderSheet(); };
  r.append(orqaga);
  const b = el("div", null, "blok");
  [
    ["Yosh", Nasl.age(p)],
    ["Qarindoshlik", Nasl.relation(S.playerId, p.id)],
    ["Holat", holatMatni(p)],
    ["Tug'ilgan yil", p.born]
  ].forEach(([n, v]) => b.append(el("div", `${n}: ${v}`)));
  r.append(b);
  const B = Nasl.balance;
  const shubha = p.shubha <= B.shubhaCalmMax ? "tinch" : (p.shubha <= B.shubhaDoubtMax ? "shubhalanmoqda" : "ishonchi yo'q");
  const barlar = el("div", null, "blok");
  [["Mehr", p.mehr, ""], ["Shubha", p.shubha, shubha]].forEach(([n, v, s]) => {
    barlar.append(el("div", `${n}: ${v}${s ? " — " + s : ""}`));
    const bar = el("div", null, "bar"); const ich = el("i");
    ich.style.width = `${v / B.statMax * B.statMax}%`;
    bar.append(ich); barlar.append(bar);
  });
  r.append(barlar);

  if (p.holat === "sevgili" && p.mehr >= 60) {
    const taklif = el("button", "Nikoh taklifi");
    taklif.onclick = () => { Nasl.nikohTaklifi(p.id); renderSheet(); };
    r.append(taklif);
  }
  if (p.holat === "xotin") {
    const ajralish = el("button", "Ajralish");
    ajralish.onclick = () => { Nasl.ajralish(p.id); renderSheet(); };
    r.append(ajralish);
  }

  const usullar = el("div"); usullar.id = "usullar";
  r.append(usullar);
  if (window.usullarniChiz) window.usullarniChiz(usullar, S, B, p.id);
  r.append(el("h3", "Tarix"));
  const t = el("div", null, "blok");
  const ism = p.name;
  const qayd = S.log.filter(l => l.text.includes(ism)).slice().reverse();
  if (!qayd.length) t.append(el("div", "Yozuv yo'q."));
  qayd.forEach(l => t.append(el("div", `${l.year}: ${l.text}`)));
  r.append(t);
}

function sozlamaQatorYarat(S, kalit, yorliqMatn, variantlar) {
  const q = el("div", null, "sozlama-qator");
  q.append(el("span", yorliqMatn, "sozlama-yorliq"));
  const seg = el("div", null, "segment");
  variantlar.forEach(([qiymat, matn]) => {
    const b = el("button", matn);
    if (S.settings[kalit] === qiymat) b.classList.add("faol");
    b.onclick = () => { S.settings[kalit] = qiymat; Nasl.save(); renderSheet(); };
    seg.append(b);
  });
  q.append(seg);
  return q;
}

function sozlamaBolimi(nom, qatorlar) {
  const bolim = el("div", null, "sozlama-bolim");
  bolim.append(el("div", nom, "sozlama-bolim-nom"));
  qatorlar.forEach(q => bolim.append(q));
  return bolim;
}

const BOOL_VARIANT = [[false, "Yo'q"], [true, "Ha"]];

function sozlamalarEkran(r, S) {
  r.append(sozlamaBolimi("Nikoh", [
    sozlamaQatorYarat(S, "nikoh", "Nikoh", [["mono", "Mono"], ["kop", "Ko'p"], ["cheksiz", "Cheksiz"]]),
    sozlamaQatorYarat(S, "lesbian", "Lesbian", BOOL_VARIANT),
  ]));

  const kontentBolim = sozlamaBolimi("Kontent", [
    sozlamaQatorYarat(S, "xxx", "XXX kasblar", BOOL_VARIANT),
    sozlamaQatorYarat(S, "matn", "Matn", [["ishora", "Ishora"], ["orta", "O'rta"], ["ochiq", "Ochiq"]]),
  ]);
  const extraSozlamalar = el("div"); extraSozlamalar.id = "extra-sozlamalar";
  kontentBolim.append(extraSozlamalar);
  r.append(kontentBolim);
  if (window.extraSozlamalarniChiz) window.extraSozlamalarniChiz(extraSozlamalar, S);

  r.append(sozlamaBolimi("O'yin", [
    sozlamaQatorYarat(S, "olim", "O'lim", BOOL_VARIANT),
    sozlamaQatorYarat(S, "tasodif", "Tasodif", [["past", "Past"], ["orta", "O'rta"], ["yuqori", "Yuqori"]]),
  ]));

  r.append(sozlamaBolimi("Qiyinlik", [
    sozlamaQatorYarat(S, "qiyinlik", "Qiyinlik", [["yumshoq", "Yumshoq"], ["normal", "Normal"], ["qattiq", "Qattiq"]]),
  ]));

  const ta = document.createElement("textarea"); ta.className = "yashirin";
  const e = el("button", "Eksport"); e.onclick = () => { ta.classList.remove("yashirin"); ta.value = Nasl.exportJSON(); };
  const i = el("button", "Import");
  i.onclick = () => {
    if (ta.classList.contains("yashirin")) { ta.classList.remove("yashirin"); ta.value = ""; return; }
    try { Nasl.importJSON(ta.value); renderSheet(); } catch (x) { ta.value = "Xato: JSON noto'g'ri"; }
  };
  r.append(e, i, ta);
}

function yangiEkran(r) {
  r.append(el("p", "Joriy saqlash o'chiriladi."));
  const t = el("button", "Boshlash");
  t.onclick = () => { Nasl.newGame(); ekranSheet = null; tanlangan = null; render(); };
  r.append(t);
}

const HARAKAT_BOLIMLAR = ["Sevgi", "Karyera", "Mulk", "Saroy", "Sog'liq"];

function harakatlarEkran(r, S) {
  if (harakatBolim === "sevgi") {
    const orqaga = el("button", "← Harakatlar");
    orqaga.onclick = () => { harakatBolim = null; renderSheet(); };
    r.append(orqaga);
    const tanishish = el("button", "Tanishish");
    const shuYilTanishgan = S.flags.tanishishYili === S.year;
    tanishish.disabled = shuYilTanishgan;
    if (shuYilTanishgan) tanishish.title = "Bu yil allaqachon tanishgansiz";
    tanishish.onclick = () => { Nasl.tanishish(); renderSheet(); };
    r.append(tanishish);
    return;
  }
  HARAKAT_BOLIMLAR.forEach(nom => {
    const b = el("button", nom, "usul");
    if (nom === "Sevgi") b.onclick = () => { harakatBolim = "sevgi"; renderSheet(); };
    else { b.disabled = true; b.title = "Hali mavjud emas"; }
    r.append(b);
  });
}

function sheetNomini() {
  if (ekranSheet === "odamlar") {
    if (tanlangan != null) return Nasl.fullName(Nasl.person(tanlangan));
    return odamlarBolim === "oila" ? "Oila" : "Odamlar";
  }
  if (ekranSheet === "sozlamalar") return "Sozlamalar";
  if (ekranSheet === "yangi") return "Yangi o'yin";
  if (ekranSheet === "harakatlar") return harakatBolim === "sevgi" ? "Sevgi" : "Harakatlar";
  return "";
}

function renderSheet() {
  const sheet = $("sheet");
  if (!ekranSheet) { sheet.classList.add("yashirin"); return; }
  sheet.classList.remove("yashirin");
  $("sheetNom").textContent = sheetNomini();
  const r = $("sheetTana"); r.innerHTML = "";
  const S = Nasl.state;
  if (ekranSheet === "odamlar") (tanlangan != null ? kartochka(r, S) : odamlarEkran(r));
  else if (ekranSheet === "sozlamalar") sozlamalarEkran(r, S);
  else if (ekranSheet === "yangi") yangiEkran(r);
  else if (ekranSheet === "harakatlar") harakatlarEkran(r, S);
}

function renderMenyuRoyxat() {
  const m = $("menyuRoyxat");
  if (!menyuOchiq) { m.classList.add("yashirin"); return; }
  m.innerHTML = "";
  for (const [k, v] of Object.entries(ekranlar)) {
    const b = el("button", v);
    b.onclick = () => {
      menyuOchiq = false;
      ekranSheet = k === "bosh" ? null : k;
      tanlangan = null;
      odamlarBolim = null;
      harakatBolim = null;
      render();
    };
    m.append(b);
  }
  m.classList.remove("yashirin");
}

function voqeaOyna(S) {
  const v = $("voqea"), o = $("voqeaOyna");
  const ev = S.pending && Nasl.events.find(e => e.id === S.pending);
  if (!ev) { v.classList.add("yashirin"); return; }
  v.classList.remove("yashirin"); o.innerHTML = "";
  o.append(el("h3", ev.title || "Voqea"), el("p", ev.text));
  ev.choices.forEach((c, i) => {
    const b = el("button", c.label);
    b.onclick = () => { Nasl.choose(i); render(); };
    o.append(b);
  });
}

function render() {
  const S = Nasl.state;
  if (!S) return;
  const B = Nasl.balance;
  renderMalumot(S, B);
  renderLenta(S);
  renderStatlar(S, B);
  renderMenyuRoyxat();
  renderSheet();
  voqeaOyna(S);
  $("yoshTugma").disabled = !!(S.pending || S.flags.over);
}

$("menyuTugma").onclick = () => { menyuOchiq = !menyuOchiq; renderMenyuRoyxat(); };
$("sheetYopish").onclick = () => {
  ekranSheet = null; tanlangan = null; odamlarBolim = null; harakatBolim = null; render();
};
$("yoshTugma").onclick = () => Nasl.nextYear();
$("munosabatTugma").onclick = () => { ekranSheet = "odamlar"; tanlangan = null; render(); };
$("harakatlarTugma").onclick = () => { ekranSheet = "harakatlar"; harakatBolim = null; render(); };

Nasl.init(".").then(render);
</script>
</body>
</html>
